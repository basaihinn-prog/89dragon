name: CI

on:
  push:
    branches:
      - main
      - production-hardening-20260918
  pull_request:

jobs:
  native-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_BASE_URL: https://casino.example/api
      VITE_IMAGE_BASE_URL: https://casino.example
      VITE_GAME_LAUNCHER_BASE_URL: https://casino.example
      VITE_WS_BASE_URL: wss://casino.example
      VITE_APP_VERSION_CODE: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
